name: Deploy Backend to AWS EC2

on:
  push:
    branches: [ "deploy" ]
    paths:
      - 'cloudnative/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Conectar a EC2 y desplegar Backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            REPO_URL="https://github.com/${{ github.repository }}.git"

            if [ ! -d "app" ]; then
              git clone $REPO_URL app
              cd app
              git checkout deploy
            else
              cd app
              git fetch --all
              git checkout deploy
              git reset --hard origin/deploy
            fi

            # Navegar a la carpeta cloudnative (donde está tu docker-compose.yml)
            cd cloudnative

            # Exportar las variables de entorno para que docker-compose las tome
            export AZURE_TENANT_ID="${{ secrets.AZURE_TENANT_ID }}"
            export AZURE_CLIENT_ID="${{ secrets.AZURE_CLIENT_ID }}"
            export DB_URL="${{ secrets.DB_URL }}"
            export DB_USERNAME="${{ secrets.DB_USERNAME }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            export RABBITMQ_HOST="rabbitmq"
            export RABBITMQ_PORT="5672"
            export RABBITMQ_USERNAME="guest"
            export RABBITMQ_PASSWORD="guest"

            # Detener contenedores anteriores y reconstruir/levantar todo
            docker compose down || true
            docker compose up -d --build

            docker image prune -f