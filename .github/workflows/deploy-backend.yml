name: Deploy Backend to AWS EC2

on:
  push:
    branches: [ "deploy" ]
    paths:
      - 'cloudnative/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Conectar a EC2 y desplegar Backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            REPO_URL="https://github.com/${{ github.repository }}.git"

            if [ ! -d "app" ]; then
              git clone $REPO_URL app
              cd app
              git checkout deploy
            else
              cd app
              git fetch --all
              git checkout deploy
              git reset --hard origin/deploy
            fi

            # Navegar a la carpeta cloudnative (donde está tu pom.xml y Dockerfile)
            cd cloudnative

            docker stop backend-container 2>/dev/null || true
            docker rm backend-container 2>/dev/null || true

            # Construir la imagen Docker usando el Dockerfile
            docker build -t backend-image -f Dockerfile .

            # Levantar el contenedor
            docker run -d \
              --name backend-container \
              --restart unless-stopped \
              -p 8080:8080 \
              -e AZURE_TENANT_ID="${{ secrets.AZURE_TENANT_ID }}" \
              -e AZURE_CLIENT_ID="${{ secrets.AZURE_CLIENT_ID }}" \
              -e DB_URL="${{ secrets.DB_URL }}" \
              -e DB_USERNAME="${{ secrets.DB_USERNAME }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              backend-image

            docker image prune -f