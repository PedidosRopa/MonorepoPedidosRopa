# ==========================================
# 1. Configuración General
# ==========================================
spring.application.name=cloudnative
server.port=8080

# ==========================================
# 2. Base de Datos Productiva / Local
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Configuración JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================================
# 3. Nombres de Colas y Exchanges (RabbitMQConfig)
# ==========================================
# Pedidos
app.rabbitmq.exchanges.pedidos=pedidos.exchange
app.rabbitmq.exchanges.dlx=pedidos.dlx
app.rabbitmq.queues.pedido-procesamiento=pedidos.procesamiento.queue
app.rabbitmq.queues.pedido-procesamiento-dlq=pedidos.procesamiento.dlq
app.rabbitmq.routing-keys.pedido-creado=pedidos.creado.routing.key
app.rabbitmq.routing-keys.pedido-dlq=pedidos.dlq.routing.key

# Productos
app.rabbitmq.exchanges.productos=productos.exchange
app.rabbitmq.exchanges.productos-dlx=productos.dlx
app.rabbitmq.queues.producto-procesamiento=productos.procesamiento.queue
app.rabbitmq.queues.producto-procesamiento-dlq=productos.procesamiento.dlq
app.rabbitmq.routing-keys.producto-creado=productos.routing.key
app.rabbitmq.routing-keys.producto-dlq=productos.dlq.routing.key

# Conexión a RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ==========================================
# 4. Seguridad OAuth2 con Azure EntraID
# ==========================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=${AZURE_CLIENT_ID},api://${AZURE_CLIENT_ID}

logging.level.org.springframework.security=DEBUG