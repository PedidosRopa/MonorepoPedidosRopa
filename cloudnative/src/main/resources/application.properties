spring.application.name=cloudnative
azure.activedirectory.tenant-id=${AZURE_TENANT_ID}
azure.activedirectory.client-id=${AZURE_CLIENT_ID}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# CONFIGURACIÓN DE CONEXIÓN A RABBITMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}

# Modo ACK manual estricto (Exigido por Indicador 5 de la rúbrica)
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# CENTRALIZACIÓN DE NOMBRES DE RABBITMQ (Indicador 1 de la rúbrica)
# Exchanges
app.rabbitmq.exchanges.pedidos=pedidos.exchange
app.rabbitmq.exchanges.dlx=pedidos.dlx

# Colas Principales y DLQ
app.rabbitmq.queues.pedido-procesamiento=pedidos.procesamiento.queue
app.rabbitmq.queues.pedido-procesamiento-dlq=pedidos.procesamiento.dlq
app.rabbitmq.queues.notificaciones-email=notificaciones.email.queue

# Routing Keys
app.rabbitmq.routing-keys.pedido-creado=pedido.creado
app.rabbitmq.routing-keys.pedido-dlq=pedido.dead-letter
app.rabbitmq.routing-keys.notificaciones=notificacion.#