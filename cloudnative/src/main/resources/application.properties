# ==========================================
# 1. Configuración General
# ==========================================
spring.application.name=cloudnative
server.port=8080

# ==========================================
# 2. Base de Datos Productiva (PostgreSQL/MySQL en AWS)
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Configuración de JPA / Hibernate para Producción
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================================
# 3. RabbitMQ
# ==========================================
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ==========================================
# 4. Seguridad OAuth2 con Azure Entra ID
# ==========================================
# URL del emisor de tokens de tu Tenant en Azure
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0

# Audience (Identificador de aplicación de tu API en Azure)
spring.security.oauth2.resourceserver.jwt.audiences=api://${AZURE_CLIENT_ID}