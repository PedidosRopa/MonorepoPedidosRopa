name: Deploy Backend to AWS EC2

on:
  push:
    branches: [ "deploy" ]
    paths:
      - 'cloudnative/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Conectar a EC2 y desplegar Backend con Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ ! -d "app" ]; then
              git clone https://github.com/DebugggMax/PedidosRopa/MonorepoPedidosRopa. app
            fi
            cd app
            git pull origin deploy
            
            # Navegar a la carpeta real del backend
            cd cloudnative

            # 1. Crear / sobrescribir el archivo .env con las variables de GitHub Secrets
            cat << EOF > .env
            SPRING_PROFILES_ACTIVE=prod
            AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}
            AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}
            DB_URL=${{ secrets.DB_URL }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            RABBITMQ_HOST=rabbitmq
            RABBITMQ_PORT=5672
            RABBITMQ_USERNAME=guest
            RABBITMQ_PASSWORD=guest
            EOF

            # 2. Detener los servicios actuales
            docker compose down || docker-compose down

            # 3. Reconstruir e iniciar los contenedores en segundo plano
            docker compose up -d --build || docker-compose up -d --build

            # 4. Limpiar imágenes no utilizadas en la EC2
            docker image prune -f