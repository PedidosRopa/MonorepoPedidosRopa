version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - node -v
        - npm install -g npm@11.12.1
        - npm ci --ignore-scripts
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist/cloudnativefront/browser
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/*
