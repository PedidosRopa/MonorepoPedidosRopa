<nav class="sticky top-0 z-20 border-b border-white/10 bg-nebula-950/80 backdrop-blur-xl">
  <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-4 py-3">
    <!-- Logo / marca -->
    <a
      class="title-grad font-display text-xl font-bold tracking-tight"
      routerLink="/landing"
    >PedidosRopa</a>

    <!-- Enlaces principales -->
    <div class="links flex flex-wrap items-center gap-1 sm:gap-2">
      <a routerLink="/landing" routerLinkActive="link-active" class="nav-link">Inicio</a>
      <a routerLink="/productos" routerLinkActive="link-active" class="nav-link">Productos</a>
      @if (auth.isLoggedIn()) {
        <a routerLink="/pedidos" routerLinkActive="link-active" class="nav-link">Mis pedidos</a>
        <a routerLink="/nuevo-pedido" routerLinkActive="link-active" class="nav-link">Nuevo pedido</a>
        <a
          routerLink="/carrito"
          routerLinkActive="link-active"
          class="nav-link relative"
        >
          Carrito
          @if (carrito.count() > 0) {
            <span class="absolute -top-1 -right-1 flex h-4 w-4 items-center justify-center rounded-full bg-rose-500 text-[10px] font-bold text-white border border-white/20">
              {{ carrito.count() }}
            </span>
          }
        </a>
        @if (auth.hasRole('REPARTIDOR')) {
          <a routerLink="/repartidor" routerLinkActive="link-active" class="nav-link">Repartidor</a>
        }
        @if (auth.hasRole('ADMINISTRADOR')) {
          <a routerLink="/admin" routerLinkActive="link-active" class="nav-link">Admin</a>
          <a routerLink="/admin-rabbit" routerLinkActive="link-active" class="nav-link">Admin RabbitMQ</a>
          <a routerLink="/admin-kafka" routerLinkActive="link-active" class="nav-link">Admin Kafka</a>
        }
        <button class="btn-ghost px-3 py-1.5 text-sm" (click)="logout()">Cerrar sesión</button>
      } @else {
        <button class="btn-grad px-3 py-1.5 text-sm" (click)="login()">Iniciar sesión</button>
      }
    </div>
  </div>
</nav>
